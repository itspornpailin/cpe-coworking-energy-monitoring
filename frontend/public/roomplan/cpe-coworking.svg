<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1295 825" role="img" aria-labelledby="title desc">
  <title id="title">CPE Co-Working Space simplified floor plan</title>
  <desc id="desc">Simplified public-facing room plan based on the CPE Co-Working Space as-built drawings. Left side is the eating zone and right side is the working zone. Sensor positions are intentionally omitted.</desc>

  <defs>
    <style>
      .wall { fill: none; stroke: #64748b; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
      .partition { fill: none; stroke: #94a3b8; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .furniture { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 4; }
      .furniture-line { fill: none; stroke: #94a3b8; stroke-width: 4; stroke-linecap: round; }
      .window { fill: none; stroke: #cbd5e1; stroke-width: 8; stroke-linecap: round; }
      .door { fill: none; stroke: #94a3b8; stroke-width: 4; stroke-linecap: round; }
      .ac { fill: #f8fafc; stroke: #94a3b8; stroke-width: 4; }
      .ac-line { stroke: #cbd5e1; stroke-width: 3; stroke-linecap: round; }
      .core { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 5; }
      .chair { fill: #f8fafc; stroke: #94a3b8; stroke-width: 3; }
    </style>
  </defs>

  <!-- Room perimeter; proportions follow the 25.90 m x approximately 16.50 m as-built grid. -->
  <path class="wall" d="M40 48 H1255 V770 H1050 V720 H690 V770 H40 Z"/>

  <!-- Top glazing / windows -->
  <path class="window" d="M92 48 H240 M274 48 H420 M460 48 H610 M650 48 H800 M840 48 H990 M1030 48 H1188"/>

  <!-- Simplified internal transition line between eating and working sides -->
  <path class="partition" d="M430 48 V370"/>
  <path class="partition" d="M430 520 V770"/>

  <!-- Central service / stair core represented neutrally -->
  <path class="core" d="M430 370 H650 V720 H520 V625 H430 Z"/>
  <path class="partition" d="M470 405 H610 V585 H470 Z"/>
  <path class="furniture-line" d="M485 430 H595 M485 455 H595 M485 480 H595 M485 505 H595 M485 530 H595 M485 555 H595"/>

  <!-- Eating-side furniture -->
  <g id="eating-furniture">
    <rect class="furniture" x="105" y="150" width="245" height="78" rx="18"/>
    <circle class="chair" cx="135" cy="125" r="16"/>
    <circle class="chair" cx="225" cy="125" r="16"/>
    <circle class="chair" cx="320" cy="125" r="16"/>
    <circle class="chair" cx="135" cy="253" r="16"/>
    <circle class="chair" cx="225" cy="253" r="16"/>
    <circle class="chair" cx="320" cy="253" r="16"/>

    <rect class="furniture" x="100" y="335" width="120" height="70" rx="16"/>
    <circle class="chair" cx="125" cy="315" r="14"/>
    <circle class="chair" cx="195" cy="315" r="14"/>
    <circle class="chair" cx="125" cy="425" r="14"/>
    <circle class="chair" cx="195" cy="425" r="14"/>

    <rect class="furniture" x="265" y="335" width="120" height="70" rx="16"/>
    <circle class="chair" cx="290" cy="315" r="14"/>
    <circle class="chair" cx="360" cy="315" r="14"/>
    <circle class="chair" cx="290" cy="425" r="14"/>
    <circle class="chair" cx="360" cy="425" r="14"/>

    <rect class="furniture" x="118" y="545" width="235" height="72" rx="18"/>
    <circle class="chair" cx="145" cy="525" r="14"/>
    <circle class="chair" cx="235" cy="525" r="14"/>
    <circle class="chair" cx="325" cy="525" r="14"/>
    <circle class="chair" cx="145" cy="638" r="14"/>
    <circle class="chair" cx="235" cy="638" r="14"/>
    <circle class="chair" cx="325" cy="638" r="14"/>
  </g>

  <!-- Working-side furniture -->
  <g id="working-furniture">
    <rect class="furniture" x="705" y="140" width="420" height="72" rx="16"/>
    <path class="furniture-line" d="M810 140 V212 M915 140 V212 M1020 140 V212"/>
    <circle class="chair" cx="755" cy="118" r="14"/>
    <circle class="chair" cx="860" cy="118" r="14"/>
    <circle class="chair" cx="965" cy="118" r="14"/>
    <circle class="chair" cx="1070" cy="118" r="14"/>
    <circle class="chair" cx="755" cy="234" r="14"/>
    <circle class="chair" cx="860" cy="234" r="14"/>
    <circle class="chair" cx="965" cy="234" r="14"/>
    <circle class="chair" cx="1070" cy="234" r="14"/>

    <rect class="furniture" x="720" y="315" width="185" height="270" rx="16"/>
    <path class="furniture-line" d="M720 382 H905 M720 450 H905 M720 518 H905"/>
    <circle class="chair" cx="690" cy="350" r="14"/>
    <circle class="chair" cx="690" cy="418" r="14"/>
    <circle class="chair" cx="690" cy="486" r="14"/>
    <circle class="chair" cx="690" cy="554" r="14"/>
    <circle class="chair" cx="935" cy="350" r="14"/>
    <circle class="chair" cx="935" cy="418" r="14"/>
    <circle class="chair" cx="935" cy="486" r="14"/>
    <circle class="chair" cx="935" cy="554" r="14"/>

    <rect class="furniture" x="995" y="315" width="170" height="270" rx="16"/>
    <path class="furniture-line" d="M995 382 H1165 M995 450 H1165 M995 518 H1165"/>
    <circle class="chair" cx="970" cy="350" r="14"/>
    <circle class="chair" cx="970" cy="418" r="14"/>
    <circle class="chair" cx="970" cy="486" r="14"/>
    <circle class="chair" cx="970" cy="554" r="14"/>
    <circle class="chair" cx="1190" cy="350" r="14"/>
    <circle class="chair" cx="1190" cy="418" r="14"/>
    <circle class="chair" cx="1190" cy="486" r="14"/>
    <circle class="chair" cx="1190" cy="554" r="14"/>

    <rect class="furniture" x="730" y="655" width="430" height="62" rx="16"/>
    <path class="furniture-line" d="M837 655 V717 M945 655 V717 M1052 655 V717"/>
  </g>

  <!-- Approximate wall-mounted AC units based on the electrical-power plan. -->
  <g id="ac-units">
    <g transform="translate(155 70)">
      <rect class="ac" width="90" height="28" rx="8"/>
      <path class="ac-line" d="M18 17 H72"/>
    </g>
    <g transform="translate(510 70)">
      <rect class="ac" width="90" height="28" rx="8"/>
      <path class="ac-line" d="M18 17 H72"/>
    </g>
    <g transform="translate(790 70)">
      <rect class="ac" width="90" height="28" rx="8"/>
      <path class="ac-line" d="M18 17 H72"/>
    </g>
    <g transform="translate(1065 70)">
      <rect class="ac" width="90" height="28" rx="8"/>
      <path class="ac-line" d="M18 17 H72"/>
    </g>
    <g transform="translate(1217 290) rotate(90)">
      <rect class="ac" width="90" height="28" rx="8"/>
      <path class="ac-line" d="M18 17 H72"/>
    </g>
    <g transform="translate(1217 510) rotate(90)">
      <rect class="ac" width="90" height="28" rx="8"/>
      <path class="ac-line" d="M18 17 H72"/>
    </g>
  </g>

  <!-- Door indications, deliberately schematic rather than construction-document detail. -->
  <g id="doors">
    <path class="door" d="M52 640 H118 M118 640 A66 66 0 0 1 52 706"/>
    <path class="door" d="M1050 720 V655 M1050 655 A65 65 0 0 1 1115 720"/>
    <path class="door" d="M1255 185 H1190 M1190 185 A65 65 0 0 1 1255 250"/>
  </g>
</svg>
